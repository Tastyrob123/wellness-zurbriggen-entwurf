<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jasswochen · erklärt</title>
<link rel="stylesheet" href="assets/css/haus.css?v=13">
<link rel="stylesheet" href="assets/css/rest-ideen.css?v=6">
<link rel="stylesheet" href="assets/css/feinschliff.css?v=4">
<link rel="stylesheet" href="assets/css/startseite2.css?v=7">
<style>
/* Jasswochen · drei Fassungen, die Jass zeigen und erklären (25.10.2026).
   Bilder ki-jass-*: KI-Platzhalter (Higgsfield), bis das Hotel echte Fotos eines Jassabends liefert. */
.jv-nr{position:sticky;top:0;z-index:50;margin:0;padding:12px var(--rand);background:#0A0805;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ms-h);border-top:1px solid rgba(217,183,88,.25)}
.jv-nr b{color:#F4EDE3;font-weight:400;margin-right:14px}
.ri.da .rt .sl>span{transform:none}
.jv .rt{font-size:clamp(40px,4vw,68px)}
.ki{position:absolute;right:12px;bottom:10px;z-index:3;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.pz{margin:0;font-family:var(--licht);font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.5;color:#E8DFD2}
.pz b{display:block;font-weight:300;font-size:clamp(40px,3.6vw,56px);line-height:1;letter-spacing:-.02em;color:var(--ms-h);margin-bottom:10px}
.pz small{display:block;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ms-h);line-height:1.8}
.jv .r-knoepfe{margin-top:clamp(26px,2.8vw,38px)}

/* Lineal der Wochen (wie heute auf der Startseite) */
.lin{position:relative;height:96px;margin:clamp(26px,3vw,40px) 0 0;border-top:1px solid rgba(217,183,88,.4)}
.lin .m{position:absolute;top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,237,227,.6)}
.lin .m::before{content:'';position:absolute;left:0;top:-16px;width:1px;height:12px;background:rgba(217,183,88,.5)}
.lin .w{position:absolute;top:36px;height:52px}
.lin .w i{position:absolute;left:0;right:0;top:0;height:8px;border-radius:4px;background:linear-gradient(90deg,#C9A54E,#F1E2B4)}
.lin .w em{position:absolute;left:0;top:16px;font-style:normal;font-family:var(--licht);font-size:13px;white-space:nowrap;color:#F4EDE3}
.lin .w:nth-child(even) em{top:34px}

/* A · So spielen wir */
.a-kopf{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(36px,5vw,96px);align-items:end}
.a-kopf .rl{justify-self:end;margin:0}
.a-gross{aspect-ratio:21/9;margin-top:clamp(36px,3.6vw,56px)}
.a-gross img{object-position:50% 55%}
.a-schritte{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,1.8vw,28px);margin-top:clamp(40px,4vw,64px)}
.a-schritte figure{aspect-ratio:4/3}
.a-schritte h3{margin:18px 0 0;font-family:var(--licht);font-weight:400;font-size:clamp(19px,1.5vw,23px)}
.a-schritte p:last-child{margin:8px 0 0;font-size:15px;line-height:1.55;opacity:.85}
.a-woche{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(36px,5vw,96px);align-items:end;margin-top:clamp(60px,6vw,96px);padding-top:clamp(36px,3.6vw,56px);border-top:1px solid rgba(217,183,88,.3)}
.a-woche h3{margin:0;font-family:var(--licht);font-weight:400;font-size:clamp(28px,2.6vw,42px);letter-spacing:-.01em}
.a-woche .rl{margin-top:12px}

/* B · Das Bild erklärt sich */
.b-bild{position:relative;margin-top:clamp(36px,3.6vw,56px)}
.b-bild figure{aspect-ratio:1024/688}
.b-pk{position:absolute;z-index:2;width:0;height:0}
.b-pk i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#E9D49A;box-shadow:0 0 0 6px rgba(233,212,154,.25),0 2px 8px rgba(0,0,0,.5)}
.b-pk s{position:absolute;top:0;height:1px;background:rgba(233,212,154,.85)}
.b-pk div{position:absolute;width:250px;padding:14px 16px;border-radius:12px;background:rgba(26,19,12,.9);box-shadow:0 18px 30px -16px rgba(0,0,0,.8),inset 0 0 0 1px rgba(217,183,88,.35)}
.b-pk .ro{margin:0 0 6px;font-size:10px}
.b-pk p:last-child{margin:0;font-size:14.5px;line-height:1.45;color:#F4EDE3}
.b-unten{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(36px,5vw,96px);margin-top:clamp(40px,4vw,64px);align-items:start}

/* C · Wie heute, nur verständlich */
.c{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(36px,5vw,96px);align-items:center}
.c-bild{aspect-ratio:4/5}
.c-bild img{object-position:38% 50%}
.c .rl b{font-weight:400;color:var(--ms-h)}
.c-drei{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:clamp(26px,2.6vw,36px)}
.c-drei figure{aspect-ratio:4/3}
.c-drei p{margin:10px 0 0;font-size:13.5px;line-height:1.45;opacity:.85}
.c-drei p b{display:block;font-family:var(--licht);font-weight:400;font-size:16px;opacity:1;color:#F4EDE3;margin-bottom:2px}
.c-preis{display:flex;gap:clamp(24px,3vw,48px);align-items:flex-end;flex-wrap:wrap;margin-top:clamp(26px,2.6vw,36px)}
.c-preis .r-knoepfe{margin:0}
@media (max-width:900px){
  .a-kopf,.a-woche,.b-unten,.c{grid-template-columns:1fr}
  .a-schritte{grid-template-columns:1fr 1fr}
  .b-pk div{display:none}
  .lin .w em{display:none}
}
</style>
</head>
<body class="rest wstart s2seite">
<main id="jv"></main>
<script>
const P=n=>`assets/img/${n}${n.startsWith('ki-')?'':'-l'}.webp`;
const fig=(n,alt,cls='')=>`<figure${cls?` class="${cls}"`:''}><img src="${P(n)}" alt="${alt}" decoding="async">${n.startsWith('ki-')?'<span class="ki">KI-Platzhalter</span>':''}</figure>`;
const pf='<em><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></em>';
const kn=(a='Platz anfragen',b='Alle Angebote')=>`<div class="r-knoepfe r-knoepfe--l"><a class="rk rk--h" href="#"><span>${a}</span>${pf}</a>${b?`<a class="rk rk--h" href="angebote.html"><span>${b}</span>${pf}</a>`:''}</div>`;
const tt=t=>`<h2 class="rt">${t.split('|').map(z=>`<span class="sl"><span>${z}</span></span>`).join('')}</h2>`;
const KO='Angebote · Jasswochen 2026/2027';
/* Lineal: November bis April, die Wochen an ihrem Datum (Werte wie auf der Startseite) */
const lineal=`<div class="lin">${[['November',0],['Dezember',16.57],['Januar',33.7],['Februar',50.83],['März',66.3],['April',83.43]].map(m=>`<span class="m" style="left:${m[1]}%">${m[0]}</span>`).join('')}
${[['1.–7. November 2026',0,3.31],['13.–18. Dezember 2026',23.2,2.76],['10.–15. Januar 2027',38.67,2.76],['24.–29. Januar 2027',46.41,2.76],['21.–26. März 2027',77.35,2.76],['4.–9. April 2027',85.08,2.76]].map(w=>`<span class="w" style="left:${w[1]}%;width:${w[2]}%"><i></i><em>${w[0]}</em></span>`).join('')}</div>`;
const PREIS=`<p class="pz"><b>Fr. 750.–</b>pro Person für die ganze Woche, also Fr. 150.– pro Nacht. Darin sind 5 Nächte im Doppelzimmer, Frühstück und 5-Gang-Abendessen, Suppe und Kuchen am Nachmittag, die 4 Jassabende und das Spa.<small>Einzelzimmer Fr. 850.– · Loft-Suite + Fr. 150.– · Hotel Monte-Moro ab Fr. 650.– · Kurtaxe nicht inbegriffen</small></p>`;
const SCHRITTE=[
  ['ki-jass-tisch-2','Vier Gäste am Jasstisch','Zu viert am Tisch','Gespielt wird zu viert, zwei gegen zwei. Ihr Partner sitzt Ihnen gegenüber.'],
  ['ki-jass-hand','Neun Jasskarten in der Hand','Neun Karten für jeden','36 Schweizer Karten in vier Farben: Schellen, Rosen, Schilten und Eicheln.'],
  ['ki-jass-stich','Vier ausgespielte Karten auf dem Jassteppich','Ein Stich nach dem anderen','Reihum legt jeder eine Karte. Die stärkste gewinnt, der Trumpf sticht alle anderen.'],
  ['ki-jass-tafel','Die Jasstafel mit dem Kreide-Z','Punkte auf die Tafel','Die Punkte kommen mit Kreide auf die Jasstafel, als Striche in ein grosses Z.']];
const F=[];

/* A · So spielen wir: grosses Bild, dann vier Bilder, die das Spiel erklären, dann die Woche */
F.push(['A · So spielen wir','schoko',`<div class="a-kopf"><div><p class="ro">${KO}</p>${tt('jassen Sie mit&nbsp;…')}</div><p class="rl">… beim Kartenspiel der Schweiz. Eine Woche lang sitzen unsere Gäste an vier Abenden am Jasstisch, am Schluss gibt es Preise. So geht Jass:</p></div>
${fig('ki-jass-tisch','Ein Jassabend in der Stube: vier Gäste, Karten auf dem grünen Jassteppich, daneben die Jasstafel','a-gross')}
<div class="a-schritte">${SCHRITTE.map(s=>`<div>${fig(s[0],s[1])}<h3>${s[2]}</h3><p>${s[3]}</p></div>`).join('')}</div>
<div class="a-woche"><div><p class="ro">Ihre Jasswoche</p><h3>Sechs Wochen im Winter, je fünf Nächte</h3><p class="rl">Tagsüber Spa, Hüttengaudi mit Fabian und ein Rundgang durchs Dorf. Abends fünf Gänge, danach wird gejasst, «Schieber» mit deutschen und französischen Karten.</p>${lineal}</div><div>${PREIS}${kn()}</div></div>`]);

/* B · Das Bild erklärt sich: ein Foto, an dem jedes Ding beschriftet ist */
const PK=[
  {x:23,y:72,dx:-1,ro:'Die Karten',t:'36 Schweizer Jasskarten, neun für jeden. Vier Farben: Schellen, Rosen, Schilten, Eicheln.',bx:-290,by:-150},
  {x:44,y:50,dx:1,ro:'Der Stich',t:'Reihum legt jeder eine Karte. Die stärkste gewinnt, der Trumpf sticht alle.',bx:-150,by:-205},
  {x:78,y:48,dx:1,ro:'Die Jasstafel',t:'Die Punkte kommen mit Kreide als Striche in ein grosses Z.',bx:40,by:120},
  {x:88,y:32,dx:1,ro:'Zu viert',t:'Zwei gegen zwei, Ihr Partner sitzt Ihnen gegenüber.',bx:-270,by:-170},
  {x:50,y:84,dx:1,ro:'Der Jassteppich',t:'Auf dem grünen Filz wird gespielt, damit die Karten nicht rutschen.',bx:60,by:-40}];
F.push(['B · Das Bild erklärt sich','schoko',`<div class="a-kopf"><div><p class="ro">${KO}</p>${tt('setzen Sie sich|an den Jasstisch&nbsp;…')}</div><p class="rl">… und spielen Sie das Kartenspiel der Schweiz. Was auf dem Tisch liegt, sehen Sie hier.</p></div>
<div class="b-bild">${fig('ki-jass-tisch','Ein Jassabend in der Stube: vier Gäste, Karten auf dem grünen Jassteppich, daneben die Jasstafel')}
${PK.map(p=>`<div class="b-pk" style="left:${p.x}%;top:${p.y}%"><i></i><div style="left:${p.bx}px;top:${p.by}px"><p class="ro">${p.ro}</p><p>${p.t}</p></div></div>`).join('')}</div>
<div class="b-unten"><div><p class="ro">Ihre Jasswoche</p><p class="rl" style="margin-top:0;font-family:var(--licht);font-weight:300;font-size:clamp(22px,1.9vw,30px);line-height:1.35;opacity:1;max-width:none">Fünf Nächte bei uns. An vier Abenden spielen alle Gäste zusammen, am Schluss gibt es Preise. Tagsüber Spa, Hüttengaudi mit Fabian und ein Rundgang durchs Dorf.</p>${lineal}</div><div>${PREIS}${kn()}</div></div>`]);

/* C · Wie heute auf der Startseite, aber mit Jass im Bild und einer Erklärung */
F.push(['C · Wie heute, nur verständlich','schoko',`<div class="c">${fig('ki-jass-tisch','Ein Jassabend in der Stube','c-bild')}
<div><p class="ro">${KO}</p>${tt('Jasswochen 2026/2027')}<p class="rl"><b>Jass ist das Kartenspiel der Schweiz:</b> zu viert, zwei gegen zwei, mit 36 Karten. In unseren Jasswochen spielen die Gäste an vier Abenden zusammen, am Schluss gibt es Preise.</p>
<div class="c-drei">${SCHRITTE.slice(1).map(s=>`<div>${fig(s[0],s[1])}<p><b>${s[2]}</b>${s[3]}</p></div>`).join('')}</div>
${lineal}
<div class="c-preis">${PREIS}</div>${kn()}</div></div>`]);

document.getElementById('jv').innerHTML=F.map(f=>`<p class="jv-nr"><b>${f[0].split(' · ')[0]}</b>${f[0].split(' · ')[1]}</p><section class="ri ri-${f[1]} s2 da jv">${f[2]}</section>`).join('');
</script>
</body>
</html>
